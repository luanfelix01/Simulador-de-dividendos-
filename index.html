<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<title>Invest Pro</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0a0f1c;
  color:white;
}

header {
  padding:15px;
  text-align:center;
  background:#020617;
  font-weight:bold;
}

.container {
  padding:15px;
}

.card {
  background:#121826;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

input, button {
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  border:none;
}

button {
  background:#22c55e;
  color:white;
  font-weight:bold;
}

.tabela {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

.tabela td {
  padding:8px;
  border-bottom:1px solid #1f2937;
}
</style>
</head>

<body>

<header>💰 Invest Pro PRO</header>

<div class="container">

<div class="card">
<h3>➕ Adicionar Ativo</h3>
<input id="ativo" placeholder="Ex: PETR4.SA">
<input id="quantidade" type="number" placeholder="Quantidade">
<button onclick="adicionar()">Adicionar</button>
</div>

<div class="card">
<h3>📊 Carteira</h3>
<table class="tabela" id="tabela"></table>
</div>

<div class="card">
<h3>📈 Distribuição</h3>
<canvas id="grafico"></canvas>
</div>

<div class="card">
<h3>💸 Dividendos</h3>
<div id="dividendos"></div>
</div>

</div>

<script>
let carteira = JSON.parse(localStorage.getItem("carteira")) || [];

async function adicionar() {
  let ativo = document.getElementById("ativo").value;
  let qtd = document.getElementById("quantidade").value;

  if(!ativo || !qtd) return alert("Preenche tudo");

  let res = await fetch(`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${ativo}`);
  let data = await res.json();

  let preco = data.quoteResponse.result[0].regularMarketPrice;

  carteira.push({
    ativo,
    qtd,
    preco
  });

  salvar();
  atualizar();
}

function salvar() {
  localStorage.setItem("carteira", JSON.stringify(carteira));
}

async function atualizar() {
  let tabela = document.getElementById("tabela");
  tabela.innerHTML = "";

  let total = 0;
  let labels = [];
  let valores = [];

  for (let item of carteira) {
    let res = await fetch(`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${item.ativo}`);
    let data = await res.json();

    let preco = data.quoteResponse.result[0].regularMarketPrice;
    let valor = preco * item.qtd;

    total += valor;

    labels.push(item.ativo);
    valores.push(valor);

    tabela.innerHTML += `
      <tr>
        <td>${item.ativo}</td>
        <td>${item.qtd}</td>
        <td>R$ ${valor.toFixed(2)}</td>
      </tr>
    `;
  }

  gerarGrafico(labels, valores);
  calcularDividendos(total);
}

function gerarGrafico(labels, valores) {
  new Chart(document.getElementById("grafico"), {
    type: 'doughnut',
    data: {
      labels: labels,
      datasets: [{
        data: valores
      }]
    }
  });
}

function calcularDividendos(total) {
  let rendimento = total * 0.009; // média mensal 0.9%

  document.getElementById("dividendos").innerHTML =
    `💰 Total investido: R$ ${total.toFixed(2)}<br>
     📈 Renda mensal estimada: R$ ${rendimento.toFixed(2)}`;
}

atualizar();

// service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
