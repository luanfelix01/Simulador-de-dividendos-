<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<title>Invest Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0f1c;
  color: white;
}

header {
  padding: 15px;
  text-align: center;
  background: #020617;
  font-weight: bold;
}

.container {
  padding: 15px;
}

.card {
  background: #121826;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 8px;
  border: none;
}

button {
  background: #22c55e;
  color: white;
  font-weight: bold;
}

canvas {
  margin-top: 10px;
}
</style>
</head>

<body>

<header>💰 Invest Pro 2026</header>

<div class="container">

<div class="card">
<label>Renda desejada</label>
<input type="number" id="renda">

<label>Yield (%)</label>
<input type="number" id="yield" value="9.2">

<button onclick="calcular()">Simular</button>
</div>

<div class="card">
<h3>📊 Dashboard</h3>
<canvas id="grafico"></canvas>
</div>

<div class="card">
<h3>📡 Preços em tempo real</h3>
<div id="ativos"></div>
</div>

<div class="card">
<h3>💸 Dividendos estimados</h3>
<div id="dividendos"></div>
</div>

</div>

<script>
const ativos = ["PETR4.SA","VALE3.SA","ITSA4.SA","BBAS3.SA"];

async function carregar() {
  let lista = document.getElementById("ativos");
  lista.innerHTML = "";

  for (let ativo of ativos) {
    let res = await fetch(`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${ativo}`);
    let data = await res.json();

    let preco = data.quoteResponse.result[0].regularMarketPrice;

    lista.innerHTML += `<p>${ativo} → R$ ${preco}</p>`;
  }
}

function calcular() {
  let renda = document.getElementById("renda").value;
  let yield = document.getElementById("yield").value;

  let capital = (renda * 12) / (yield / 100);

  document.getElementById("dividendos").innerHTML =
    `💰 Capital: R$ ${capital.toFixed(2)}<br>
     📈 Dividendos/mês: R$ ${renda}`;

  gerarGrafico(capital);
}

function gerarGrafico(capital) {
  new Chart(document.getElementById("grafico"), {
    type: 'doughnut',
    data: {
      labels: ["Renda Fixa", "FIIs", "Ações"],
      datasets: [{
        data: [40, 30, 30]
      }]
    }
  });
}

carregar();
setInterval(carregar, 10000);

// SERVICE WORKER
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
