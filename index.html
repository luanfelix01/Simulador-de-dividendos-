<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivendo de Renda 2026</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  padding: 10px;
}

h1 {
  text-align: center;
}

.box {
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: none;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: #22c55e;
  border: none;
  border-radius: 8px;
  color: white;
  font-weight: bold;
}

.tabela {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

.tabela th, .tabela td {
  padding: 10px;
  border-bottom: 1px solid #334155;
}

.tabela th {
  background: #020617;
}

.resumo {
  background: #020617;
  padding: 10px;
  border-radius: 8px;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>📊 Simulador Vivendo de Renda 2026</h1>

<div class="box">
  <label>Renda mensal desejada</label>
  <input type="number" id="renda" placeholder="Ex: 5000">

  <label>Yield anual (%)</label>
  <input type="number" id="yield" value="9.2">

  <button onclick="calcular()">Calcular</button>
</div>

<div class="resumo" id="resumo"></div>

<div class="box">
  <h3>Distribuição por Ativos</h3>

  <table class="tabela">
    <thead>
      <tr>
        <th>Ativo</th>
        <th>%</th>
        <th>Valor (R$)</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>
</div>

<script>
function calcular() {
  let renda = parseFloat(document.getElementById("renda").value);
  let yield = parseFloat(document.getElementById("yield").value);

  if(!renda || !yield) {
    alert("Preenche tudo!");
    return;
  }

  let capital = (renda * 12) / (yield / 100);

  document.getElementById("resumo").innerHTML = `
    💰 Capital necessário: R$ ${capital.toLocaleString('pt-BR', {minimumFractionDigits:2})}
    <br>📈 Yield médio: ${yield}%
  `;

  let ativos = [
    {nome: "IPCA+ 2035", pct: 14},
    {nome: "IPCA+ 2045", pct: 4},
    {nome: "Pré-fixado", pct: 21},
    {nome: "Tesouro Selic", pct: 4.7},

    {nome: "FIIs (MXRF, HGLG...)", pct: 28},

    {nome: "PETR4", pct: 2.5},
    {nome: "ITSA4", pct: 2.5},
    {nome: "BBAS3", pct: 2.5},
    {nome: "VALE3", pct: 2.5},
    {nome: "TAEE11", pct: 2.5},
    {nome: "EGIE3", pct: 2.5},
    {nome: "BBSE3", pct: 2.5},
    {nome: "WEGE3", pct: 2.5}
  ];

  let tabela = document.getElementById("tabela");
  tabela.innerHTML = "";

  ativos.forEach(a => {
    let valor = (capital * a.pct) / 100;

    tabela.innerHTML += `
      <tr>
        <td>${a.nome}</td>
        <td>${a.pct}%</td>
        <td>R$ ${valor.toLocaleString('pt-BR', {minimumFractionDigits:2})}</td>
      </tr>
    `;
  });

  // salvar automático
  localStorage.setItem("renda", renda);
  localStorage.setItem("yield", yield);
}

// carregar dados salvos
window.onload = function() {
  let renda = localStorage.getItem("renda");
  let yield = localStorage.getItem("yield");

  if(renda) document.getElementById("renda").value = renda;
  if(yield) document.getElementById("yield").value = yield;

  if(renda && yield) calcular();
}
</script>

</body>
</html>
